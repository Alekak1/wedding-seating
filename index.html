<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Znajdź swój stolik</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
        <div class="top-title">
            <p class="names">Karolina i Alek</p>
            <p class="date">03.06.2026</p>
        </div>
      <h1>Znajdź swój stolik</h1>
      <p class="subtitle">
        Wpisz swoje imię i nazwisko, a pokażemy Ci numer stolika.
      </p>

      <form id="guestForm">
        <label for="guestName">Imię i nazwisko</label>
        <input
          type="text"
          id="guestName"
          placeholder="np. Anna Kowalska"
          autocomplete="name"
          required
        />

        <button type="submit">Sprawdź stolik</button>
      </form>

      <div id="result" class="result hidden"></div>

      <div class="map-wrapper">
        <p class="map-title">Mapa sali</p>

        <svg id="tableMap" viewBox="0 0 1000 720" role="img" aria-label="Mapa stołów">
          <!-- Główny stół -->
          <g id="table-main" class="table main-table">
            <ellipse cx="500" cy="80" rx="345" ry="76" />
            <text x="500" y="80" text-anchor="middle" dominant-baseline="middle">Główny</text>
          </g>

          <!-- Rząd górny -->
          <g id="table-1" class="table">
            <circle cx="360" cy="260" r="75" />
            <text x="360" y="260" text-anchor="middle" dominant-baseline="middle">1</text>
          </g>

          <g id="table-2" class="table">
            <circle cx="640" cy="260" r="75" />
            <text x="640" y="260" text-anchor="middle" dominant-baseline="middle">2</text>
          </g>

          <!-- Rząd środkowy -->
          <g id="table-3" class="table">
            <circle cx="80" cy="440" r="75" />
            <text x="80" y="440" text-anchor="middle" dominant-baseline="middle">3</text>
          </g>

          <g id="table-4" class="table">
            <circle cx="360" cy="440" r="75" />
            <text x="360" y="440" text-anchor="middle" dominant-baseline="middle">4</text>
          </g>

          <g id="table-5" class="table">
            <circle cx="640" cy="440" r="75" />
            <text x="640" y="440" text-anchor="middle" dominant-baseline="middle">5</text>
          </g>

          <g id="table-6" class="table">
            <circle cx="920" cy="440" r="75" />
            <text x="920" y="440" text-anchor="middle" dominant-baseline="middle">6</text>
          </g>

          <!-- Rząd dolny -->
          <g id="table-7" class="table">
            <circle cx="230" cy="630" r="75" />
            <text x="230" y="630" text-anchor="middle" dominant-baseline="middle">7</text>
          </g>

          <g id="table-8" class="table">
            <circle cx="510" cy="630" r="75" />
            <text x="510" y="630" text-anchor="middle" dominant-baseline="middle">8</text>
          </g>

          <g id="table-9" class="table">
            <circle cx="790" cy="630" r="75" />
            <text x="790" y="630" text-anchor="middle" dominant-baseline="middle">9</text>
          </g>
        </svg>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
