<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Znajdź swój stolik</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
        <div class="top-title">
            <p class="names">Karolina i Alek</p>
            <p class="date">03.06.2026</p>
        </div>
      <h1>Znajdź swój stolik</h1>
      <p class="subtitle">
        Wpisz swoje imię i nazwisko, a pokażemy Ci numer stolika.
      </p>

      <form id="guestForm">
        <label for="guestName">Imię i nazwisko</label>
        <input
          type="text"
          id="guestName"
          placeholder="np. Anna Kowalska"
          autocomplete="name"
          required
        />

        <button type="submit">Sprawdź stolik</button>
      </form>

      <div id="result" class="result hidden"></div>

      <div class="map-wrapper">
        <p class="map-title">Mapa sali</p>

    <svg id="tableMap" viewBox="0 0 1000 700" role="img" aria-label="Mapa stołów">
      <!-- Stół Młodych -->
      <g id="table-main" class="table main-table" transform="translate(690 130) rotate(28)">
        <ellipse cx="0" cy="0" rx="225" ry="65" />
        <text x="0" y="0" text-anchor="middle" dominant-baseline="middle">Stół Młodych</text>
      </g>
    
      <!-- Górna część -->
      <g id="table-3" class="table">
        <circle cx="150" cy="210" r="70" />
        <text x="150" y="210" text-anchor="middle" dominant-baseline="middle">3</text>
      </g>
    
      <g id="table-1" class="table">
        <circle cx="390" cy="190" r="70" />
        <text x="390" y="190" text-anchor="middle" dominant-baseline="middle">1</text>
      </g>
    
      <!-- Środek -->
      <g id="table-7" class="table">
        <circle cx="210" cy="390" r="70" />
        <text x="210" y="390" text-anchor="middle" dominant-baseline="middle">7</text>
      </g>
    
      <g id="table-4" class="table">
        <circle cx="410" cy="365" r="70" />
        <text x="410" y="365" text-anchor="middle" dominant-baseline="middle">4</text>
      </g>
    
      <g id="table-2" class="table">
        <circle cx="660" cy="315" r="70" />
        <text x="660" y="315" text-anchor="middle" dominant-baseline="middle">2</text>
      </g>
    
      <g id="table-5" class="table">
        <circle cx="675" cy="500" r="70" />
        <text x="675" y="500" text-anchor="middle" dominant-baseline="middle">5</text>
      </g>
    
      <!-- Dół -->
      <g id="table-9" class="table">
        <circle cx="120" cy="585" r="70" />
        <text x="120" y="585" text-anchor="middle" dominant-baseline="middle">9</text>
      </g>
    
      <g id="table-8" class="table">
        <circle cx="315" cy="585" r="70" />
        <text x="315" y="585" text-anchor="middle" dominant-baseline="middle">8</text>
      </g>
    
      <g id="table-6" class="table">
        <circle cx="510" cy="585" r="70" />
        <text x="510" y="585" text-anchor="middle" dominant-baseline="middle">6</text>
      </g>
    </svg>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
