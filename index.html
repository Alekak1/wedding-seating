<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Znajdź swój stolik</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
        <div class="top-title">
            <p class="names">Karolina i Alek</p>
            <p class="date">03.06.2026</p>
        </div>
      <h1>Znajdź swój stolik</h1>
      <p class="subtitle">
        Wpisz swoje imię i nazwisko, a pokażemy Ci numer stolika.
      </p>

      <form id="guestForm">
        <label for="guestName">Imię i nazwisko</label>
        <input
          type="text"
          id="guestName"
          placeholder="np. Anna Kowalska"
          autocomplete="name"
          required
        />

        <button type="submit">Sprawdź stolik</button>
      </form>

      <div id="result" class="result hidden"></div>

      <div class="map-wrapper">
        <p class="map-title">Mapa sali</p>

  <svg id="tableMap" viewBox="0 0 1000 720" role="img" aria-label="Mapa stołów">
    <!-- Stół Młodych / Główny po skosie -->
    <g id="table-main" class="table main-table" transform="translate(630 145) rotate(28)">
      <ellipse cx="0" cy="0" rx="240" ry="72" />
      <text x="0" y="0" text-anchor="middle" dominant-baseline="middle">Stół Młodych</text>
    </g>
  
    <!-- Górna część sali -->
    <g id="table-1" class="table">
      <circle cx="130" cy="200" r="75" />
      <text x="130" y="200" text-anchor="middle" dominant-baseline="middle">1</text>
    </g>
  
    <g id="table-2" class="table">
      <circle cx="380" cy="185" r="75" />
      <text x="380" y="185" text-anchor="middle" dominant-baseline="middle">2</text>
    </g>
  
    <!-- Środkowa część sali -->
    <g id="table-3" class="table">
      <circle cx="180" cy="390" r="75" />
      <text x="180" y="390" text-anchor="middle" dominant-baseline="middle">3</text>
    </g>
  
    <g id="table-4" class="table">
      <circle cx="390" cy="385" r="75" />
      <text x="390" y="385" text-anchor="middle" dominant-baseline="middle">4</text>
    </g>
  
    <g id="table-5" class="table">
      <circle cx="620" cy="325" r="75" />
      <text x="620" y="325" text-anchor="middle" dominant-baseline="middle">5</text>
    </g>
  
    <!-- Prawa część sali -->
    <g id="table-6" class="table">
      <circle cx="630" cy="535" r="75" />
      <text x="630" y="535" text-anchor="middle" dominant-baseline="middle">6</text>
    </g>
  
    <!-- Dolna część sali -->
    <g id="table-7" class="table">
      <circle cx="80" cy="610" r="75" />
      <text x="80" y="610" text-anchor="middle" dominant-baseline="middle">7</text>
    </g>
  
    <g id="table-8" class="table">
      <circle cx="270" cy="610" r="75" />
      <text x="270" y="610" text-anchor="middle" dominant-baseline="middle">8</text>
    </g>
  
    <g id="table-9" class="table">
      <circle cx="460" cy="610" r="75" />
      <text x="460" y="610" text-anchor="middle" dominant-baseline="middle">9</text>
    </g>
  </svg>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
